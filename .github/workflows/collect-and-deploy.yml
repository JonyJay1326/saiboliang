# ============================================================
# 赛博粮仓 · 采集 + 校验 + 构建 + 提交 + 部署（同一 workflow）
# 依据：AGENTS.md §7、TASKS.md B7 / B9
#   - push 到 main 即发布；cron 每天 3 次兜底：UTC 03:17 / 07:17 / 11:17
#   - 构建门禁：构建失败不推进 public/data 与 source-health（pipeline 内建）
#   - 部署成功后才回写 data/state，失败则下次重采，不让状态先于站点推进
#   - 机器人回写用 GITHUB_TOKEN，不会再次触发本 workflow（无循环）
# ============================================================
name: collect-build-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3,7,11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-deploy
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: code-frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline unit tests
        run: python -m unittest discover -s code-backend

      - name: Collect + validate + build gate
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python code-backend/pipeline.py collect --build-cwd code-frontend --build-command npm run build
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "pipeline exit 1: no publishable batch or build failed"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::pipeline exit 2: partial module failure, publishing updated batch"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: code-frontend/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Commit data and state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code-backend/public code-backend/state
          if git diff --cached --quiet; then
            echo "no data or state changes to commit"
            exit 0
          fi
          version=$(python -c "import json;print(json.load(open('code-backend/public/data/version.json'))['version'])")
          git commit -m "chore(data): scheduled batch ${version}"
          git pull --rebase origin main
          git push
